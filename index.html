<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Affirmations for My Lovely Muddyy akoo 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #ffe6ea 0%, #ffe5f1 100%);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #5a3e47;
      overflow-x: hidden;
      position: relative;
    }

    /* Modal Buka Pesan & Play Musik */
    .welcome-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 230, 235, 0.98);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .welcome-overlay h2 {
      font-family: 'Sacramento', cursive;
      font-size: 2.5rem;
      color: #ff4d6d;
      margin-bottom: 10px;
    }
    .welcome-btn {
      background: linear-gradient(45deg, #ff758f, #ff4d6d);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
      margin-top: 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 30px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4);
      text-align: center;
      max-width: 380px;
      width: 100%;
      border: 2px solid #fff;
      z-index: 1;
    }
    h1 {
      font-family: 'Sacramento', cursive;
      font-size: 2.3rem;
      color: #ff6b8b;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: #88606c;
      margin-bottom: 25px;
    }

    /* Styling Galeri Foto Polaroid */
    .gallery {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }
    .polaroid {
      background: white;
      padding: 10px 10px 18px 10px;
      border-radius: 12px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.06);
      transform: rotate(-2deg);
    }
    .polaroid:nth-child(even) {
      transform: rotate(2deg);
    }
    .polaroid img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
    }
    .polaroid p {
      font-family: 'Sacramento', cursive;
      font-size: 1.3rem;
      color: #ff4d6d;
      margin-top: 6px;
    }

    .box {
      background: #fff0f3;
      border: 2px dashed #ffb3c1;
      padding: 20px 15px;
      border-radius: 16px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 600;
      color: #c9184a;
      margin-bottom: 25px;
      transition: transform 0.2s ease;
    }
    button {
      background: linear-gradient(45deg, #ff758f, #ff4d6d);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(255, 77, 109, 0.3);
      transition: all 0.2s;
    }
    button:active { transform: scale(0.95); }

    /* Animasi Heart */
    .heart-float {
      position: fixed;
      color: #ff758f;
      font-size: 20px;
      user-select: none;
      pointer-events: none;
      animation: floatUp 4s linear infinite;
      z-index: 0;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Audio Background -->
  <audio id="bgMusic" loop>
    <source src="lagu.mp3" type="audio/mpeg">
  </audio>

  <!-- Layer Popup Buka Musik -->
  <div class="welcome-overlay" id="welcomeModal">
    <h2>for my dearest person shynta wulandary💌</h2>
    <p style="font-size: 0.85rem; color: #88606c;">coba nyalain suaranya donk🥰</p>
    <button class="welcome-btn" onclick="startWeb()">Buka Disini 💖</button>
  </div>

  <div class="card">
    <h1>haiiii tataa sayangnya akuuu!... 💕</h1>
    <p class="subtitle">klik tombol di bawah tiap kali kamu kangen aku yaaa ~calonsuamimu adittyaaa hehehehe!~</p>

    <!-- Galeri Foto Kamu & Sinta -->
    <div class="gallery">
      <div class="polaroid">
        <img src="foto1.jpg" alt="Foto Sinta 1">
        <p>You & Me 💖</p>
      </div>
      <div class="polaroid">
        <img src="foto2.jpg" alt="Foto Sinta 2">
        <p>Gaya andalan kamu yang selalu bikin aku meleleh🫠🌸</p>
      </div>
    </div>
    
    <div class="box" id="affirmationBox">
      ✨ klik tombol di bawah ya ndutt 🫣
    </div>

    <button onclick="generateAffirmation()">Ambil kata kata dari aku buat kamu Hari Ini😗🫶</button>
  </div>

  <script>
    function startWeb() {
      document.getElementById('welcomeModal').style.display = 'none';
      document.getElementById('bgMusic').play();
      setInterval(createHeart, 400);
    }

    /* Kata-kata afirmasi asli milikmu */
    const listAfirmasi = [
      "sayangkuu muddyykuuu, kalau aku boleh jujur meski aku gasuka rasa matcha,tapi kamu jauh lebih manis dan lebih indah dari matcha favorit kamu itu karna kamu favorit nya akuuu 🤍✨.",
      "kurang beruntung apa aku dapetin kamu ya baby,YOU ARE MY EVERYTHING huhuu🥹🤍.",
      "kalau baby aku ngerasa capek,suka sakit badan, istirahat dulu yaa dari semua aktivitas nyaa bubupp. Kamu udaaa berusaha maksimal banget hari ini!! dan aku selalu bangga sama kamuu💓.",
      "kamu selalu cukup, bahkan lebih dari cukup. ada akuuuu aditt!! yang selalu ada buat kamu babyy!!🩵🐻‍❄️.",
      "muddykuu,kamu pas cemberut aja lucu dan cantik sekali yaa aku liatliattt, apalagi kalau prengat prengut!!🥰💖.",
      "semangat terus yaa babyy akuu hari ini!! Ada aku yang selalu bangga sama kamu,dan selalu sayang kamu!🧸🌸"
    ];

    function generateAffirmation() {
      const box = document.getElementById("affirmationBox");
      const acak = Math.floor(Math.random() * listAfirmasi.length);
      box.style.transform = "scale(0.95)";
      setTimeout(() => {
        box.innerText = listAfirmasi[acak];
        box.style.transform = "scale(1)";
      }, 100);
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-float');
      heart.innerHTML = ['💖', '🌸', '✨', '💕', '🥰'][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 2 + 3 + 's';
      document.body.appendChild(heart);

      setTimeout(() => { heart.remove(); }, 5000);
    }
  </script>

</body>
</html>
